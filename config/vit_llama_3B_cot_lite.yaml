data:
  data_root: "./data/"
  dataset: "trac_cot"
  train_val_split: 0.9

  train_val_dir: pseudo_3d/32_all_slices/0fa350fe-9eb2-4b61-916f-5a29e322f6ab/train/data
  test_dir: pseudo_3d/32_all_slices/0fa350fe-9eb2-4b61-916f-5a29e322f6ab/test/data

  image_train_path: clean_data_s_chain/train/image
  image_test_path: clean_data_s_chain/test/image
  overfit_train: False
  train_sample: -1
  val_sample: -1
  test_sample: -1
  dataloader_pin_memory: False
  config:
    significant_slice
general:
  max_eval: 4
  trainer: standard
  collator: "standard"

  lora: True
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj","gate_proj", "up_proj", "down_proj",        
        "lm_head",                                  
        # "embed_tokens",
        ]
  lora_bias: "none"

model:
  tags: [llama, ViT]
  name: vit_llama
  config:
    language_model: 
      name: meta-llama/Llama-3.2-3B
    vision_encoder:
        pretrained_path: pretrained_ViT.bin
        vision_tower: vit3d
        img_size: [32, 256, 256]
        patch_size: [4, 16, 16]
        in_channels: 1
        hidden_size: 768
        num_heads: 8
        vision_select_layer: -1
        vision_select_feature: cls_patch
    projector:
      image_size: [32, 256, 256]
      patch_size: [4, 16, 16]
      in_embed: 768
      hidden_size: 768
      hiddend_dim: 1072
      out_embed: 3072
      layer_type: mlp
      layer_num: 3
      pooling_type: spatial
      pooling_size: 2
      mm_projector_type: spp_3d
  
training:
  output_dir: "./output"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  max_steps: 1000
  logging_dir: "./logs"  
  eval_strategy: "steps"
  eval_steps: 100
  logging_steps: 50
  save_steps: 100
  save_strategy: "steps"
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  dataloader_num_workers: 4
  save_total_limit: 2
  load_best_model_at_end: true
  report_to: wandb
  remove_unused_columns: false
  seed: 42
  fp16: False
  bf16: False
  metric_for_best_model: loss
  greater_is_better: False
  save_safetensors: False
  dataloader_pin_memory: False